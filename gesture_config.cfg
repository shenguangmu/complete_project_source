#=====================================================================
# 手势预处理链 —— HLS 工程配置
#
# 用法（Vitis 2025.2 没有 vitis_hls 命令，只有 vitis-run）：
#   vitis-run --mode hls --tcl src_hls/run_gesture.tcl
#
# 与 hls_config.cfg 的关系：
#   原 Sobel 加速器（sobel_accel）保持独立、可单独综合与回归，
#   配置在根目录的 hls_config.cfg。本文件是新链的配置，两者互不影响。
#=====================================================================

part=xc7z020clg400-1

[hls]
syn.file=./src_hls/gesture_preproc.cpp
syn.top=gesture_preproc
tb.file=./src_hls/tb_gesture.cpp
tb.file=./src_hls/gesture_ref.cpp

# 目标时钟周期 10ns = 100 MHz。
# 采集链上游 PCLK 约 24 MHz，100 MHz 有 4 倍余量。
clock=10

package.output.format=ip_catalog
flow_target=vivado

sim.O=1
csim.clean=1
# csim.setup=0 → 编译并执行 csim，才能看到 TB PASSED
csim.setup=0
csim.profile_tripcount=0
