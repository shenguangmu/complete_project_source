name: RTL simulation

# =====================================================================
#  为什么有这个 CI
# =====================================================================
#
#  1) 本项目有两套「秒级、无需 license」的回归，但**都要手动记得跑**：
#         bash rtl/run_iverilog.sh         # 纯 RTL（3 个 TB）
#         bash sw/build_preproc_sim.sh     # PS 驱动主机自检
#     忘了跑，改了 RTL 也不会有人拦。
#
#  2) 赛题 §3.3.4 明确要求「保证工程可由他人从零复现」。
#     每次 push 的自动回归记录，就是**可复现性的直接证据** ——
#     比在报告里写「我们验证过了」有力得多。
#
#  ─── sw 那个脚本怎么进得来（2026-09 追加） ───
#     它原先在 Ubuntu 上必红：探测写死了 `clang.exe`（Windows 专有）。
#     给脚本加了一层「Vitis clang → PATH 上的 cc/gcc/clang」的回退
#     （三个 .c 实测无 Windows 依赖，目标侧 xil_* 头文件被
#     #ifdef PREPROC_SIM_BUILD 隔开），Windows 本地行为一字未变。
#     所以下面两个 job 都是真的能跑通的，不是摆样子。
#
#  ⚠ 诚实的边界：本 CI **没有**在 Windows 上验证过（GitHub runner 是
#     Ubuntu，本机 Git Bash 又不带 gcc）。第一次 push 后请看 Actions
#     页面的实际结果，红了就照日志修。
# =====================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 允许手动触发

jobs:
  rtl-sim:
    name: RTL 回归（iverilog）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 源里的 iverilog 版本够用（TB 用的是 -g2012 标准语法）
      - name: 安装 iverilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog

      - name: 版本确认（写进日志，便于复现）
        run: iverilog -V 2>&1 | head -2

      # ⚠ 跑一次，同时做两件事：留完整日志 + 显式校验通过标记。
      #
      #   为什么不用「脚本退出码」就够了：
      #   本项目的经验是 **"脚本跑完" 不等于 "测试通过"**
      #   （见 skill/pitfalls 的模式 2：返回码 0 但流程已断）。
      #   所以显式 grep 通过标记，宁可多一道。
      - name: 跑 RTL 回归并校验通过标记
        run: |
          set -o pipefail
          bash rtl/run_iverilog.sh 2>&1 | tee /tmp/rtl.log
          if ! grep -q 'ALL RTL TESTS PASSED' /tmp/rtl.log; then
            echo "::error::日志里没有 '*** ALL RTL TESTS PASSED ***' —— 回归未真正通过"
            exit 1
          fi

  # ⚠ PS 驱动自检与 RTL 是**两件独立的事**，所以拆成两个 job：
  #   谁红了看一眼 job 名就知道是哪一侧。
  #   （代价是多一次 checkout + apt，几秒钟的事。）
  sw-sim:
    name: PS 驱动主机自检（C）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 本脚本不依赖 Vitis —— 目标侧的 xil_* 头文件被
      # #ifdef PREPROC_SIM_BUILD 隔开，仿真模式只用标准 C 库。
      - name: 安装 C 编译器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: 版本确认（写进日志，便于复现）
        run: cc --version | head -1

      # ⚠ 判据是脚本自己的通过标记，不是退出码 —— 同 rtl-sim 的理由。
      #
      #   顺带说明：脚本的退出码**已经是可信的**（它 return 的是
      #   g_fail==0 ? 0 : 1，不是无条件 0）。再加一道 grep 是**冗余**，
      #   但代价只有一行，而本项目确实吃过「返回码 0 但流程已断」的亏，
      #   所以宁可多一道。
      #
      #   [!] 这份自检的**边界**（别把它当上板证明）：
      #       - 它验证的是驱动的**控制流**：地址对齐检查、参数检查、
      #         寄存器写序、超时/重试路径
      #       - `preproc_sim.c` 里的执行函数是**朴素 C 实现**，
      #         不是 HLS 那个 IP 的逐位等价物 —— 它**不校验算法结果**
      #       - 所以 `[6] 输出: 非零像素 4992/9216` 这类数字只证明
      #         "数据流没断"，不证明 PL 侧算得对
      #       真机行为仍须等板卡到位实测。
      - name: 跑 PS 驱动自检并校验通过标记
        run: |
          set -o pipefail
          bash sw/build_preproc_sim.sh 2>&1 | tee /tmp/sw.log
          if ! grep -q 'PREPROC DRIVER SIM PASSED' /tmp/sw.log; then
            echo "::error::日志里没有 '*** PREPROC DRIVER SIM PASSED ***' —— 自检未真正通过"
            exit 1
          fi

  # ⚠ 第三个 job：host/ 侧的 PYNQ 驱动离线自检。
  #   它覆盖的是 gesture_overlay.py 里**与硬件无关**的那部分：
  #   参数检查 + 寄存器编码。2026-09-18 在那里发现过一个静默 bug
  #   （有符号阈值偏置写成 8 位补码，IP 读回来从 -8 变 +248，
  #    输出全黑且不报错）—— C 驱动做对了，Python 侧没人查。
  #   这类"不需要板子、纯逻辑"的东西必须进 CI，否则永远不会被发现。
  overlay-offline:
    name: PYNQ 驱动离线自检（Python）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ⚠ 本测试**不 import pynq** —— gesture_overlay.py 把 pynq 的导入
      #   放在 try/except 里，所以能在没有 PYNQ 环境的 runner 上静态检查。
      - name: 版本确认（写进日志，便于复现）
        run: python --version

      - name: 跑离线自检并校验通过标记
        run: |
          set -o pipefail
          python host/test_overlay_offline.py 2>&1 | tee /tmp/overlay.log
          if ! grep -q 'OVERLAY OFFLINE TESTS PASSED' /tmp/overlay.log; then
            echo "::error::日志里没有 '*** OVERLAY OFFLINE TESTS PASSED ***' —— 自检未真正通过"
            exit 1
          fi

  # ⚠ 第四个 job：操作手册的渲染校验。
  #   为什么"生成文档"也要进 CI：
  #   build_manual.py 跑完会打印"已生成"，但那**不说明渲染是对的**。
  #   渲染器最典型的失败模式是**静默丢内容** —— 某个写法没被识别，
  #   那一段就悄悄没了。而这是要**打印出来照着做**的操作手册，
  #   漏一行可能就是漏掉一个烧板前的检查步骤。
  #
  #   scripts/test_manual.py 做的就是拿源 Markdown 和生成的 docx
  #   反向对账，看有没有内容在渲染过程中消失。
  manual:
    name: 操作手册渲染校验
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 python-docx
        run: pip install --quiet python-docx

      - name: 解析器单测（构造用例 + 真实文档夹具）
        run: |
          set -o pipefail
          python scripts/test_mdblock.py 2>&1 | tee /tmp/mdblock.log
          if ! grep -q 'MDBLOCK TESTS PASSED' /tmp/mdblock.log; then
            echo "::error::Markdown 解析器测试未通过"
            exit 1
          fi

      - name: 生成手册并校验内容完整
        run: |
          set -o pipefail
          python scripts/build_manual.py
          python scripts/test_manual.py 2>&1 | tee /tmp/manual.log
          if ! grep -q 'MANUAL TESTS PASSED' /tmp/manual.log; then
            echo "::error::手册渲染校验未通过（可能丢了内容）"
            exit 1
          fi
